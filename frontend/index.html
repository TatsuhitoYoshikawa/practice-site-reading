<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>譜読みれんしゅう</title>
    <style>
      /* プログラムの読み込みが終わるまでの表示（React の描画で置き換わる） */
      .boot { display: flex; height: 100vh; align-items: center; justify-content: center; gap: 10px;
        font-family: system-ui, sans-serif; color: #555; background: #fffdf8; }
      .boot-spinner { width: 20px; height: 20px; border: 3px solid #ddd; border-top-color: #3b6fd8;
        border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><span class="boot-spinner"></span>アプリを読み込み中…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
